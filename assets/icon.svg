<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    The application icon. This file is the source: `assets/icon.ico` and the PNGs
    beside it are rendered from it by `tools/render-icon.cjs`, and the Android
    client's two adaptive-icon layers are the same drawing split in half.

    What it is: the window this application is. A tab bar where one tab is live —
    the accent blue is the tab bar's own accent colour, the state dot is the lightened
    green of the dot the tab bar puts on a tab that is up, and the two tabs are the
    local Harness and a remote one. Three decisions were measured rather than
    assumed, each by rendering the ladder 16…512 and looking at it:

    * **The tile is lifted off the background.** At `#15151a` the tile disappeared
      into a `#1c1c1c` taskbar and the icon read as a floating blue shape. It starts
      at `#26262f` now, two steps above the application's own background colour.
    * **Only two tabs.** Three, and at 16 pixels the shapes are a grey smear: there
      is not enough width for three tab silhouettes at that size.
    * **The rounding is larger than it looks like it should be.** 32 units on a 256
      canvas is two pixels at 16, and those two pixels are the only thing that says
      "tab" rather than "rectangle".

    The drawing is bottom-anchored: both tabs are flush on the shelf at y=178, which
    is what makes them tabs rather than two floating cards.
  -->
  <defs>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
    <linearGradient id="tileFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262f"/>
      <stop offset="1" stop-color="#1d1d24"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#tileFill)"/>
    <rect x="0" y="178" width="256" height="78" fill="#34343f"/>
  </g>

  <!-- The live tab: rounded top, square bottom, standing on the shelf. -->
  <path d="M30 108 a32 32 0 0 1 32 -32 h48 a32 32 0 0 1 32 32 v70 h-112 z" fill="#5b9dff"/>
  <!-- A second one, shorter, so the mark says there is more than one. -->
  <path d="M158 134 a26 26 0 0 1 26 -26 h22 a26 26 0 0 1 26 26 v44 h-74 z" fill="#61616f"/>
  <!-- The state dot, nested in the live tab's corner arc: its centre is the arc's
       centre, so it sits in the corner instead of floating near it. -->
  <circle cx="62" cy="108" r="16" fill="#7ef0a8"/>
</svg>
