<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    The application icon — 32 pixels and up. `assets/icon-small.svg` is the same
    drawing simplified for 16, 20 and 24, which are rendered from that file instead.

    What it says, in four shapes and no thin lines: a window with a tab bar (this
    application, and one tab per session), a dashed link out to two more machines
    (remote — a link that crosses a distance, which is what the dashes are for), and
    those machines in two steps of grey so the nearer one is nearer.

    Three decisions came out of rendering the ladder 16…512 and looking at it:

    * **The dashes are coarse on purpose.** `26 18` with round caps still shows a
      break at 64 pixels; a finer rhythm — `20 14` was tried — is a soft line by 64
      and indistinguishable from solid below it.
    * **Nothing here is a hairline.** Every element is a filled shape or a stroke at
      least 18 of 256 wide, because a thin line is the first thing to disappear.
    * **The palette is measured, not chosen.** `#fbfbfb` and `#31343c` are the tile
      and the mark of the DeepSeek Harness desktop application's own icon, read out
      of its pixels; `#b6bbc4` / `#dcdfe4` are the same neutrality, receding.
  -->
  <defs><clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath></defs>
  <g clip-path="url(#tile)"><rect width="256" height="256" fill="#fbfbfb"/></g>

  <!-- The link out to each machine: dashed, so it reads as a connection rather than
       as a cable. -->
  <g stroke="#31343c" stroke-width="18" stroke-linecap="round" fill="none" stroke-dasharray="26 18">
    <path d="M126 110 L166 68"/>
    <path d="M126 146 L166 188"/>
  </g>

  <!-- This machine: a window, with a tab bar in it. -->
  <rect x="24" y="78" width="104" height="104" rx="30" fill="#31343c"/>
  <rect x="44" y="100" width="38" height="15" rx="7.5" fill="#fbfbfb"/>
  <rect x="90" y="100" width="20" height="15" rx="7.5" fill="#6d727d"/>

  <!-- The other machines. -->
  <rect x="170" y="32" width="62" height="62" rx="20" fill="#b6bbc4"/>
  <rect x="170" y="162" width="62" height="62" rx="20" fill="#dcdfe4"/>
</svg>
